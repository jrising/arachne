version: 1

commands:
  - op: write
    path: index.html
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport"
                content="width=device-width, initial-scale=1">
          <title>Counter demonstration</title>
          <link rel="icon" href="data:,">
          <link rel="stylesheet" href="styles.css">
          <script src="app.js" defer></script>
        </head>
        <body>
          <main>
            <h1>A small beginning</h1>
            <p>Click the button to increase the counter.</p>
            <button id="count" type="button"
                    aria-label="Increase counter">0</button>
          </main>
        </body>
      </html>

  - op: write
    path: styles.css
    content: |
      :root {
        font-family: system-ui, sans-serif;
        color: #173042;
        background: #eef4f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        padding: 32px;
        background: white;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgb(0 0 0 / 8%);
      }

      h1 {
        margin-top: 0;
      }

      button {
        min-width: 80px;
        min-height: 48px;
        border: 0;
        border-radius: 8px;
        background: #155a83;
        color: white;
        font: inherit;
        font-size: 24px;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #e39b12;
        outline-offset: 4px;
      }

  - op: write
    path: app.js
    content: |
      "use strict";

      const counter = document.querySelector("#count");

      counter.addEventListener("click", () => {
        counter.textContent = String(Number(counter.textContent) + 1);
      });

check:
  page: index.html
  viewport:
    width: 1280
    height: 800
  interactions:
    - action: assert_visible
      selector: "#count"
    - action: click
      selector: "#count"
    - action: assert_text
      selector: "#count"
      equals: "1"
  visual_expectations: |
    A white card is centered on a pale background.
    The heading, explanatory paragraph, and blue counter button are readable.
    The counter displays 1.
    Nothing overlaps or is clipped.